<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コーデ気温記録アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-lg pb-20">
        
        <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
            <h1 class="text-xl font-bold text-center">My コーデ記録</h1>
        </header>

        <main class="p-4">
            <div class="mb-8 p-4 bg-orange-50 rounded-xl border border-orange-200 shadow-sm">
                <h2 class="font-bold mb-3 text-orange-800">📋 新しく記録する</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-500 font-bold">コーデ写真</label>
                        <input type="file" accept="image/*" @change="onFileChange" 
                            class="w-full p-2 border border-dashed border-orange-300 rounded-lg bg-orange-100 text-sm">
                        <div v-if="previewUrl" class="mt-2 text-center">
                            <img :src="previewUrl" class="max-h-48 mx-auto rounded-lg shadow-sm">
                        </div>
                    </div>

                    <div>
                        <label class="text-xs text-gray-500 font-bold">場所</label>
                        <select v-model="selectedCity" class="w-full p-2 border rounded-lg bg-white">
                            <option v-for="city in cityList" :key="city.name" :value="city">
                                {{ city.name }}
                            </option>
                        </select>
                    </div>

                    <div>
                        <label class="text-xs text-gray-500 font-bold">日付</label>
                        <input type="date" v-model="targetDate" class="w-full p-2 border rounded-lg">
                        <p v-if="isAutoDate" class="text-[10px] text-green-600 font-bold">✨ 写真から日付を取得しました</p>
                    </div>

                    <button @click="fetchWeather" :disabled="loading"
                        class="w-full bg-orange-500 text-white py-4 rounded-lg font-bold hover:bg-orange-600 disabled:bg-gray-400 shadow-md">
                        {{ loading ? '取得中...' : '気温を自動取得' }}
                    </button>

                    <div v-if="weatherResult" class="flex justify-around p-3 bg-white rounded-lg border-2 border-orange-400">
                        <div class="text-center">
                            <p class="text-xs text-gray-500 italic">最高</p>
                            <p class="text-2xl font-bold text-red-500">{{ weatherResult.max }}℃</p>
                        </div>
                        <div class="text-center">
                            <p class="text-xs text-gray-500 italic">最低</p>
                            <p class="text-2xl font-bold text-blue-500">{{ weatherResult.min }}℃</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    loading: false,
                    targetDate: '',
                    selectedCity: { name: '東京', lat: 35.689, lon: 139.692 },
                    weatherResult: null,
                    previewUrl: null, // 写真のプレビュー用
                    isAutoDate: false, // 自動入力されたかどうかのフラグ
                    cityList: [
                        { name: '札幌', lat: 43.064, lon: 141.346 },
                        { name: '日高', lat: 42.337, lon: 142.368 },
                        { name: '仙台', lat: 38.268, lon: 140.869 },
                        { name: '東京', lat: 35.689, lon: 139.692 },
                        { name: '横浜', lat: 35.444, lon: 139.638 },
                        { name: '名古屋', lat: 35.181, lon: 136.906 },
                        { name: '大阪', lat: 34.693, lon: 135.502 },
                        { name: '奈良', lat: 34.685, lon: 135.832 },
                        { name: '広島', lat: 34.385, lon: 132.453 },
                        { name: '福岡', lat: 33.590, lon: 130.401 },
                        { name: '那覇', lat: 26.212, lon: 127.681 }
                    ]
                }
            },
            methods: {
                // 写真が選択された時の処理
                onFileChange(e) {
                    const file = e.target.files[0];
                    if (!file) return;

                    // プレビュー表示
                    this.previewUrl = URL.createObjectURL(file);
                    this.isAutoDate = false;

                    // Exif情報を解析
                    const self = this;
                    EXIF.getData(file, function() {
                        const dateTag = EXIF.getTag(this, "DateTimeOriginal");
                        if (dateTag) {
                            // Exifの日付形式 "2024:05:25 12:00:00" を "2024-05-25" に変換
                            const datePart = dateTag.split(' ')[0].replace(/:/g, '-');
                            self.targetDate = datePart;
                            self.isAutoDate = true;
                        } else {
                            console.log("Exif情報が見つかりませんでした");
                        }
                    });
                },
                async fetchWeather() {
                    if (!this.targetDate) {
                        alert("日付を選んでください（写真をアップすると自動で入ります）");
                        return;
                    }
                    this.loading = true;
                    this.weatherResult = null;

                    const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${this.selectedCity.lat}&longitude=${this.selectedCity.lon}&start_date=${this.targetDate}&end_date=${this.targetDate}&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;

                    try {
                        const response = await fetch(url);
                        const data = await response.json();
                        this.weatherResult = {
                            max: data.daily.temperature_2m_max[0],
                            min: data.daily.temperature_2m_min[0]
                        };
                    } catch (error) {
                        alert("気温データの取得に失敗しました。");
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
