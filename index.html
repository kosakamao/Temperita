<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>気温でコーデ検索 -Temperita-</title>
    <link rel="apple-touch-icon" href="https://via.placeholder.com/180x180/645CAA/ffffff?text=T">
    <meta name="apple-mobile-web-app-title" content="Temperita">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        [v-cloak] { display: none; }
        body { font-family: 'Noto Sans JP', sans-serif; }
        .font-logo { font-family: 'Parisienne', cursive; }
        .bg-main { background-color: #645CAA; }
        .bg-sub { background-color: #A084CA; }
        .bg-accent { background-color: #EBC7E8; }
        .text-main { color: #645CAA; }
        .aspect-square { aspect-ratio: 1 / 1; }
        .btn-plus { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-[#F8F6FA] text-gray-700 pb-20">

    <div id="app" v-cloak class="max-w-md mx-auto min-h-screen bg-white shadow-xl relative">
        <header class="bg-main text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
            <h1 class="text-3xl font-logo px-2">Temperita</h1>
            <button @click="showInput = !showInput" class="btn-plus bg-white text-main px-4 py-2 rounded-full text-xs font-bold shadow-lg transition active:scale-95">
                {{ showInput ? '閉じる' : '新規記録 ＋' }}
            </button>
        </header>

        <main>
            <div class="p-4 border-b border-gray-100 bg-white">
                <div class="flex items-center gap-3 bg-[#F8F6FA] p-3 rounded-2xl">
                    <span class="text-lg">🔍</span>
                    <input type="number" step="0.1" v-model="filterTemp" placeholder="最高気温で検索 (例: 26.5)" class="bg-transparent border-none outline-none w-full text-sm font-bold">
                    <button v-if="filterTemp" @click="filterTemp = null" class="text-gray-400 text-xs">Clear</button>
                </div>
                <p v-show="filterTemp" class="text-[10px] text-[#A084CA] mt-2 px-1 font-bold">
                    ✨ {{ (filterTemp - 0.5).toFixed(1) }}℃ 〜 {{ (filterTemp + 0.5).toFixed(1) }}℃ の記録を表示中
                </p>
            </div>

            <div v-if="showInput" class="p-5 bg-white border-b-2 border-accent/30 space-y-4">
                <div class="relative border-2 border-dashed border-[#BFACE0] rounded-2xl p-2 bg-[#F8F6FA] text-center">
                    <input type="file" accept="image/*" @change="onFileChange" class="absolute inset-0 opacity-0 cursor-pointer">
                    <div v-if="!previewUrl" class="py-10 text-[#A084CA] text-xs font-bold">写真をアップロード</div>
                    <img v-if="previewUrl" :src="previewUrl" class="max-h-64 mx-auto rounded-xl shadow-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <input type="date" v-model="targetDate" class="w-full p-3 bg-[#F8F6FA] border-none rounded-xl text-xs shadow-inner">
                        <p v-if="isAutoDate" class="text-[9px] text-green-500 mt-1 font-bold px-1 animate-bounce">✨ 写真から日付を取得しました！</p>
                    </div>
                    <select v-model="selectedCity" class="p-3 bg-[#F8F6FA] border-none rounded-xl text-xs shadow-inner h-[42px]">
                        <option v-for="city in cityList" :key="city.name" :value="city">{{ city.name }}</option>
                    </select>
                </div>
                <button @click="fetchWeather" :disabled="loading || !targetDate" class="w-full bg-sub text-white py-3 rounded-xl font-bold shadow-md disabled:bg-gray-300 transition">
                    {{ loading ? '取得中...' : '気温を取得' }}
                </button>
                <div v-if="weatherResult" class="space-y-4">
                    <div class="flex justify-around p-3 bg-white rounded-xl border border-accent">
                        <div class="text-center"><p class="text-[8px] text-gray-400 uppercase">Max</p><p class="text-xl font-bold text-red-400">{{ weatherResult.max }}℃</p></div>
                        <div class="text-center"><p class="text-[8px] text-gray-400 uppercase">Min</p><p class="text-xl font-bold text-blue-400">{{ weatherResult.min }}℃</p></div>
                    </div>
                    <textarea v-model="memo" placeholder="メモ..." class="w-full p-3 bg-[#F8F6FA] border-none rounded-xl text-sm h-20 shadow-inner outline-none"></textarea>
                    <button @click="saveEntry" class="w-full bg-main text-white py-4 rounded-xl font-bold shadow-lg">保存して次を登録</button>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-0.5 mt-0.5">
                <div v-for="entry in filteredHistory" :key="entry.id" @click="viewDetail(entry)" class="relative aspect-square group overflow-hidden bg-gray-100">
                    <img :src="entry.imageData" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 right-1 bg-black/40 text-white text-[8px] px-1.5 py-0.5 rounded backdrop-blur-sm font-bold">
                        {{ entry.maxTemp }}℃
                    </div>
                </div>
            </div>
        </main>

        <div v-if="selectedEntry" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4" @click="selectedEntry = null">
            <div class="bg-white rounded-[2rem] w-full max-w-sm overflow-hidden" @click.stop>
                <div class="max-h-[50vh] overflow-hidden">
                    <img :src="selectedEntry.imageData" class="w-full h-auto">
                </div>
                <div class="p-6 space-y-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">Date & City</label>
                        <div class="flex gap-2">
                            <input type="date" v-model="selectedEntry.date" @change="updateAndRefetchWeather(selectedEntry)" class="bg-gray-50 border-none rounded-lg p-2 text-xs flex-1">
                            <select v-model="selectedEntry.city" @change="updateAndRefetchWeather(selectedEntry)" class="bg-gray-50 border-none rounded-lg p-2 text-xs w-24">
                                <option v-for="city in cityList" :key="city.name" :value="city.name">{{ city.name }}</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="flex justify-around p-3 bg-[#F8F6FA] rounded-xl relative">
                        <div v-if="modalLoading" class="absolute inset-0 bg-white/50 flex items-center justify-center rounded-xl z-10 text-[10px] font-bold text-main">更新中...</div>
                        <div class="text-center flex-1"><p class="text-[8px] text-gray-400">Max</p><p class="font-bold text-red-400">{{ selectedEntry.maxTemp }}℃</p></div>
                        <div class="text-center flex-1 border-l border-gray-200"><p class="text-[8px] text-gray-400">Min</p><p class="font-bold text-blue-400">{{ selectedEntry.minTemp }}℃</p></div>
                    </div>

                    <textarea v-model="selectedEntry.memo" @change="updateEntry(selectedEntry)" class="w-full p-3 bg-gray-50 border-none rounded-xl text-sm h-20 outline-none"></textarea>
                    
                    <div class="flex justify-between items-center pt-2">
                        <button @click="deleteEntry(selectedEntry.id)" class="text-[10px] text-gray-300 hover:text-red-500">削除</button>
                        <button @click="selectedEntry = null" class="bg-main text-white px-8 py-2 rounded-xl font-bold shadow-md">
