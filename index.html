<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperita - コーデ記録</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-10">

    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-lg">
        
        <header class="bg-blue-600 text-white p-4 sticky top-0 z-20 shadow-md">
            <h1 class="text-xl font-bold text-center italic">Temperita</h1>
        </header>

        <main class="p-4 space-y-6">
            <div class="p-4 bg-orange-50 rounded-2xl border border-orange-200 shadow-sm space-y-4">
                <h2 class="font-bold text-orange-800 flex items-center italic">
                    <span class="mr-2">📝</span> 新しく記録する
                </h2>
                
                <div class="relative border-2 border-dashed border-orange-300 rounded-xl p-2 bg-white text-center">
                    <input type="file" accept="image/*" @change="onFileChange" class="absolute inset-0 opacity-0 cursor-pointer">
                    <div v-if="!previewUrl" class="py-4 text-orange-400 text-sm font-bold">
                        📷 タップして写真を選択
                    </div>
                    <img v-if="previewUrl" :src="previewUrl" class="max-h-60 mx-auto rounded-lg shadow-sm">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400">日付</label>
                        <input type="date" v-model="targetDate" class="w-full p-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400">場所</label>
                        <select v-model="selectedCity" class="w-full p-2 border rounded-lg text-sm bg-white">
                            <option v-for="city in cityList" :key="city.name" :value="city">{{ city.name }}</option>
                        </select>
                    </div>
                </div>

                <button @click="fetchWeather" :disabled="loading" 
                    class="w-full bg-orange-500 text-white py-2 rounded-xl font-bold hover:bg-orange-600 disabled:bg-gray-300 shadow-sm transition">
                    {{ loading ? '取得中...' : '気温をチェック' }}
                </button>

                <div v-if="weatherResult" class="flex justify-around p-3 bg-white rounded-xl border-2 border-orange-400 animate-bounce-short">
                    <div class="text-center"><p class="text-[10px] text-gray-400">最高</p><p class="text-xl font-bold text-red-500">{{ weatherResult.max }}℃</p></div>
                    <div class="text-center"><p class="text-[10px] text-gray-400">最低</p><p class="text-xl font-bold text-blue-500">{{ weatherResult.min }}℃</p></div>
                </div>

                <div v-if="weatherResult" class="space-y-3 pt-2">
                    <textarea v-model="memo" placeholder="感想（ちょうどよかった、など）" class="w-full p-2 border rounded-xl text-sm h-20"></textarea>
                    <button @click="saveEntry" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700">
                        ✨ このコーデを保存する
                    </button>
                </div>
            </div>

            <hr class="border-gray-100">

            <div class="space-y-4">
                <h2 class="font-bold text-gray-400 flex items-center px-1">
                    <span class="mr-2">👗</span> 過去のコーデ一覧
                </h2>
                
                <div v-for="entry in history" :key="entry.id" class="bg-white border rounded-2xl overflow-hidden shadow-sm">
                    <img :src="entry.imageData" class="w-full h-auto object-cover max-h-80">
                    <div class="p-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-xs text-gray-400">{{ entry.date }} ({{ entry.city }})</p>
                                <p class="text-sm mt-1 whitespace-pre-wrap">{{ entry.memo }}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-red-500 font-bold">{{ entry.maxTemp }}℃</span>
                                <span class="text-gray-300 mx-1">/</span>
                                <span class="text-blue-500 font-bold">{{ entry.minTemp }}℃</span>
                            </div>
                        </div>
                        <button @click="deleteEntry(entry.id)" class="mt-2 text-[10px] text-red-300 hover:text-red-500">削除する</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const { createApp } = Vue
        
        // 1. データベースの準備 (Dexie.js)
        const db = new Dexie("TemperitaDB");
        db.version(1).stores({
            entries: '++id, date, maxTemp' // idは自動、日付と気温で検索できるように
        });

        createApp({
            data() {
                return {
                    loading: false, targetDate: '', selectedCity: { name: '東京', lat: 35.689, lon: 139.692 },
                    weatherResult: null, previewUrl: null, memo: '', imageData: null, history: [],
                    cityList: [
                        { name: '札幌', lat: 43.064, lon: 141.346 }, { name: '日高', lat: 42.337, lon: 142.368 },
                        { name: '東京', lat: 35.689, lon: 139.692 }, { name: '横浜', lat: 35.444, lon: 139.638 },
                        { name: '大阪', lat: 34.693, lon: 135.502 }, { name: '奈良', lat: 34.685, lon: 135.832 },
                        { name: '那覇', lat: 26.212, lon: 127.681 }
                    ]
                }
            },
            async mounted() {
                this.loadHistory(); // 起動時に過去データを読み込む
            },
            methods: {
                onFileChange(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    this.previewUrl = URL.createObjectURL(file);
                    
                    // 保存用に画像を文字データ（Base64）に変換
                    const reader = new FileReader();
                    reader.onload = (event) => { this.imageData = event.target.result; };
                    reader.readAsDataURL(file);

                    const self = this;
                    EXIF.getData(file, function() {
                        const dateTag = EXIF.getTag(this, "DateTimeOriginal");
                        if (dateTag) {
                            self.targetDate = dateTag.split(' ')[0].replace(/:/g, '-');
                        }
                    });
                },
                async fetchWeather() {
                    if (!this.targetDate) return alert("日付を選んでね");
                    this.loading = true;
                    try {
                        const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${this.selectedCity.lat}&longitude=${this.selectedCity.lon}&start_date=${this.targetDate}&end_date=${this.targetDate}&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;
                        const res = await fetch(url);
                        const data = await res.json();
                        this.weatherResult = { max: data.daily.temperature_2m_max[0], min: data.daily.temperature_2m_min[0] };
                    } catch (e) { alert("気温エラー"); } finally { this.loading = false; }
                },
                async saveEntry() {
                    if (!this.imageData || !this.weatherResult) return;
                    await db.entries.add({
                        imageData: this.imageData,
                        date: this.targetDate,
                        city: this.selectedCity.name,
                        maxTemp: this.weatherResult.max,
                        minTemp: this.weatherResult.min,
                        memo: this.memo,
                        timestamp: Date.now()
                    });
                    // 入力欄をリセット
                    this.previewUrl = null; this.weatherResult = null; this.memo = ''; this.imageData = null;
                    this.loadHistory();
                },
                async loadHistory() {
                    // 日付が新しい順に並べて取得
                    this.history = await db.entries.orderBy('date').reverse().toArray();
                },
                async deleteEntry(id) {
                    if (confirm('削除してもいい？')) {
                        await db.entries.delete(id);
                        this.loadHistory();
                    }
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
