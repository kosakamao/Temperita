<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>気温でコーデ検索 -Temperita-</title>
    
    <link rel="apple-touch-icon" href="https://via.placeholder.com/180x180/645CAA/ffffff?text=T">
    <meta name="apple-mobile-web-app-title" content="Temperita">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        [v-cloak] { display: none; }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #F8F6FA; }
        .font-logo { font-family: 'Parisienne', cursive; }
        .bg-main { background-color: #645CAA; }
        .bg-sub { background-color: #A084CA; }
        .bg-accent { background-color: #EBC7E8; }
        .text-main { color: #645CAA; }
        .aspect-square { aspect-ratio: 1 / 1; }
    </style>
</head>
<body class="text-gray-700 pb-20">

    <div id="app" v-cloak class="max-w-md mx-auto min-h-screen bg-white shadow-xl relative">
        
        <header class="bg-main text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
            <h1 class="text-3xl font-logo px-2">Temperita</h1>
            <button @click="showInput = !showInput" class="bg-white text-main px-4 py-2 rounded-full text-xs font-bold shadow-lg">
                {{ showInput ? '閉じる' : '新規記録 ＋' }}
            </button>
        </header>

        <main>
            <div class="p-4 border-b border-gray-100 bg-white space-y-3">
                <input type="number" step="0.1" v-model="filterTemp" placeholder="最高気温で検索 (例: 26.5)" 
                    class="bg-[#F8F6FA] p-3 rounded-2xl outline-none w-full text-sm font-bold text-center">
                
                <div class="flex justify-end items-center gap-2 px-1">
                    <span class="text-[10px] text-gray-400 font-bold">並び替え：</span>
                    <select v-model="sortOrder" class="bg-[#F8F6FA] text-xs font-bold p-1.5 px-3 rounded-xl outline-none border border-gray-100 text-gray-600">
                        <option value="newest">日付が新しい順</option>
                        <option value="tempDesc">🔥 気温が高い順</option>
                        <option value="tempAsc">🧊 気温が低い順</option>
                    </select>
                </div>
            </div>

            <div v-if="showInput" class="p-5 bg-white border-b-2 border-accent/30 space-y-4">
                <div class="relative border-2 border-dashed border-[#BFACE0] rounded-2xl p-2 bg-[#F8F6FA] text-center">
                    <input type="file" accept="image/*" @change="onFileChange" class="absolute inset-0 opacity-0 cursor-pointer">
                    <div v-if="!previewUrl" class="py-10 text-[#A084CA] text-xs font-bold">写真をアップロード</div>
                    <img v-if="previewUrl" :src="previewUrl" class="max-h-64 mx-auto rounded-xl">
                    <p v-if="isCompressing" class="text-[10px] text-main mt-2 font-bold animate-pulse">✨ 画質をきれいに保ったまま軽量化中...</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <input type="date" v-model="targetDate" class="p-3 bg-[#F8F6FA] rounded-xl text-xs">
                    <select v-model="selectedCityName" class="p-3 bg-[#F8F6FA] rounded-xl text-xs h-[42px]">
                        <option v-for="city in cityList" :key="city.name" :value="city.name">{{ city.name }}</option>
                    </select>
                </div>

                <button @click="fetchWeather" :disabled="loading || !targetDate" class="w-full bg-sub text-white py-3 rounded-xl font-bold shadow-md disabled:bg-gray-300">
                    {{ loading ? '取得中...' : '気温を取得' }}
                </button>

                <div v-if="weatherResult" class="space-y-4">
                    <div class="flex justify-around p-3 bg-white rounded-xl border border-accent">
                        <div class="text-center font-bold"><p class="text-[8px] text-gray-400">MAX</p><p class="text-red-400">{{ weatherResult.max }}℃</p></div>
                        <div class="text-center font-bold"><p class="text-[8px] text-gray-400">MIN</p><p class="text-blue-400">{{ weatherResult.min }}℃</p></div>
                    </div>
                    <textarea v-model="memo" placeholder="メモ..." class="w-full p-3 bg-[#F8F6FA] rounded-xl text-sm h-20 outline-none shadow-inner"></textarea>
                    <button @click="saveEntry" class="w-full bg-main text-white py-4 rounded-xl font-bold shadow-lg tracking-widest">
                        ✨ コーデを登録
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-0.5 mt-0.5">
                <div v-for="entry in filteredHistory" :key="entry.id" @click="viewDetail(entry)" class="relative aspect-square bg-gray-100 overflow-hidden">
                    <img :src="entry.imageData" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 right-1 bg-black/40 text-white text-[8px] px-1.5 py-0.5 rounded backdrop-blur-sm font-bold">
                        {{ entry.maxTemp }}℃
                    </div>
                </div>
            </div>

            <div v-if="filteredHistory.length === 0" class="text-center py-20 text-gray-400 text-sm">
                No matching outfits 👗
            </div>
        </main>

        <div v-if="selectedEntry" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4" @click="selectedEntry = null">
            <div class="bg-white rounded-[2rem] w-full max-w-sm overflow-hidden" @click.stop>
                <img :src="selectedEntry.imageData" class="w-full h-auto">
                <div class="p-6 space-y-4">
                    <div class="flex justify-between items-center text-xs font-bold text-main">
                        <p>{{ selectedEntry.date }} @{{ selectedEntry.city }}</p>
                        <p class="text-red-400">{{ selectedEntry.maxTemp }}℃ / <span class="text-blue-400">{{ selectedEntry.minTemp }}℃</span></p>
                    </div>
                    <p class="text-sm text-gray-600 leading-relaxed">{{ selectedEntry.memo }}</p>
                    <div class="flex justify-between items-center pt-2">
                        <button @click="deleteEntry(selectedEntry.id)" class="text-[10px] text-gray-300">削除</button>
                        <button @click="selectedEntry = null" class="bg-main text-white px-8 py-2 rounded-xl font-bold">閉じる</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue
        const db = new Dexie("TemperitaDB");
        db.version(1).stores({ entries: '++id, date, maxTemp' });

        createApp({
            data() {
                return {
                    showInput: false, loading: false, isCompressing: false,
                    targetDate: '', selectedCityName: '東京',
                    weatherResult: null, previewUrl: null, memo: '', imageData: null, history: [], filterTemp: null,
                    selectedEntry: null,
                    sortOrder: 'newest', // デフォルトは日付順
                    cityList: [
                        { name: '札幌', lat: 43.064, lon: 141.346 }, { name: '日高', lat: 42.337, lon: 142.368 },
                        { name: '仙台', lat: 38.268, lon: 140.869 }, { name: '千葉', lat: 35.607, lon: 140.106 },
                        { name: '埼玉', lat: 35.857, lon: 139.649 }, { name: '東京', lat: 35.689, lon: 139.692 }, 
                        { name: '静岡', lat: 34.975, lon: 138.383 }, { name: '横浜', lat: 35.444, lon: 139.638 }, 
                        { name: '名古屋', lat: 35.181, lon: 136.906 }, { name: '京都', lat: 35.011, lon: 135.768 }, 
                        { name: '大阪', lat: 34.693, lon: 135.502 }, { name: '神戸', lat: 34.690, lon: 135.195 }, // ← 神戸市を追加！
                        { name: '奈良', lat: 34.685, lon: 135.832 }, { name: '広島', lat: 34.385, lon: 132.453 }, 
                        { name: '福岡', lat: 33.590, lon: 130.401 }, { name: '那覇', lat: 26.212, lon: 127.681 }
                    ]
                }
            },
            computed: {
                filteredHistory() {
                    let result = [...this.history];

                    // 【変更】気温での絞り込み幅を「±2.0度」に変更！
                    if (this.filterTemp) {
                        result = result.filter(e => Math.abs(e.maxTemp - Number(this.filterTemp)) <= 2.0);
                    }

                    // 【NEW】並び替えの処理
                    if (this.sortOrder === 'tempDesc') {
                        // 最高気温が高い順
                        result.sort((a, b) => b.maxTemp - a.maxTemp);
                    } else if (this.sortOrder === 'tempAsc') {
                        // 最高気温が低い順
                        result.sort((a, b) => a.maxTemp - b.maxTemp);
                    } else {
                        // 日付が新しい順 (Dexieロード時のデフォルト)
                        result.sort((a, b) => new Date(b.date) - new Date(a.date));
                    }

                    return result;
                }
            },
            async mounted() { this.loadHistory(); },
            methods: {
                onFileChange(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    this.isCompressing = true;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const maxSide = 1600;

                            if (width > height) {
                                if (width > maxSide) { height *= maxSide / width; width = maxSide; }
                            } else {
                                if (height > maxSide) { width *= maxSide / height; height = maxSide; }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);
                            this.imageData = compressedBase64;
                            this.previewUrl = compressedBase64;
                            this.isCompressing = false;
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);

                    const self = this;
                    EXIF.getData(file, function() {
                        const dateTag = EXIF.getTag(this, "DateTimeOriginal");
                        if (dateTag) self.targetDate = dateTag.split(' ')[0].replace(/:/g, '-');
                    });
                },
                async fetchWeather() {
                    if (!this.targetDate) return;
                    this.loading = true;
                    this.weatherResult = null;
                    const cityData = this.cityList.find(c => c.name === this.selectedCityName);
                    if (!cityData) { this.loading = false; return; }

                    try {
                        const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${cityData.lat}&longitude=${cityData.lon}&start_date=${this.targetDate}&end_date=${this.targetDate}&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;
                        const res = await fetch(url);
                        const data = await res.json();
                        if (data && data.daily && data.daily.temperature_2m_max) {
                            this.weatherResult = { max: data.daily.temperature_2m_max[0], min: data.daily.temperature_2m_min[0] };
                        } else { alert("データが見つかりません"); }
                    } catch (e) { alert("通信エラー"); } finally { this.loading = false; }
                },
                async saveEntry() {
                    if (!this.imageData || !this.weatherResult) return;
                    await db.entries.add({
                        imageData: this.imageData, date: this.targetDate, city: this.selectedCityName,
                        maxTemp: this.weatherResult.max, minTemp: this.weatherResult.min,
                        memo: this.memo, timestamp: Date.now()
                    });
                    this.previewUrl = null; this.weatherResult = null; this.memo = ''; this.imageData = null; this.showInput = false;
                    this.loadHistory();
                },
                async loadHistory() { this.history = await db.entries.orderBy('date').reverse().toArray(); },
                viewDetail(entry) { this.selectedEntry = entry; },
                async deleteEntry(id) { if (confirm('消去しますか？')) { await db.entries.delete(id); this.selectedEntry = null; this.loadHistory(); } }
            }
        }).mount('#app')
    </script>
</body>
</html>
